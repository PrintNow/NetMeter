<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="up" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="down" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bg)"/>

  <!-- 上行箭头（青绿）：竖杆 + 三角箭头 -->
  <rect x="240" y="168" width="32" height="100" rx="16" fill="url(#up)"/>
  <path fill="url(#up)" d="M 256 116 L 216 176 h 80 Z"/>

  <!-- 下行箭头（蓝色）：竖杆 + 三角箭头 -->
  <rect x="240" y="236" width="32" height="100" rx="16" fill="url(#down)"/>
  <path fill="url(#down)" d="M 256 352 L 296 292 h -80 Z"/>

  <!-- 项目名称 -->
  <text x="256" y="416" text-anchor="middle"
        font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1"
        fill="#0c4a6e">NetMeter</text>
</svg>
