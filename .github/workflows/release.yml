name: Build & Release

on:
  push:
    tags: ["v*"]

env:
  SCHEME: NetMeter
  PROJECT: NetMeter.xcodeproj

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          xcodebuild clean build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate app and verify architectures
        run: |
          APP=$(find build -name "NetMeter.app" -type d | head -1)
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          lipo -info "$APP/Contents/MacOS/NetMeter"

      - name: Create zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="NetMeter-${VERSION}.zip"
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" NetMeter.app
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
